<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante Pizzería Plaza - Carta Digital</title>
  <style>
    :root { --primary: #2c3e50; --accent: #e74c3c; --bg: #f4f7f6; --card-bg: #ffffff; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; padding-bottom: 120px; color: #333; }
    h1 { text-align: center; color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #7f8c8d; font-size: 0.9rem; margin-bottom: 25px; }
    
    .categoria-titulo { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 5px; margin-top: 35px; font-size: 1.5rem; text-transform: uppercase; }
    .platos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; }
    .plato-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; transition: box-shadow 0.3s ease; }
    .plato-card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
    
    .img-container { width: 100%; height: 140px; overflow: hidden; }
    .plato-img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .plato-card:hover .plato-img { transform: scale(1.1); }
    .plato-img:active { transform: scale(0.95); }
    
    .plato-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .plato-info h3 { margin: 0 0 5px 0; font-size: 1.05rem; color: var(--primary); }
    .plato-info p { margin: 0 0 10px 0; font-size: 0.85rem; color: #666; flex-grow: 1; line-height: 1.3;}
    .precio-fila { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .precio { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
    .btn-add { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
    .btn-add:active { background: #c0392b; transform: scale(0.95); }

    .carrito-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; background: var(--primary); color: white; border-radius: 30px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 100; }
    .btn-pedir { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* Camarero IA flotante y chat completo */
    .ia-btn { position: fixed; bottom: 80px; right: 15px; background: linear-gradient(135deg, #6dd5ed, #2193b0); color: white; border: none; border-radius: 50px; padding: 12px 20px; font-weight: bold; box-shadow: 0 4px 12px rgba(33, 147, 176, 0.4); cursor: pointer; z-index: 99; display: flex; align-items: center; gap: 8px; }
    .chat-window { display: none; position: fixed; bottom: 80px; right: 15px; width: 320px; height: 400px; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.3); z-index: 101; overflow: hidden; flex-direction: column; border: 2px solid #2193b0; }
    .chat-header { background: #2193b0; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .chat-body { padding: 15px; flex-grow: 1; overflow-y: auto; background: #f9f9f9; font-size: 0.9rem; display: flex; flex-direction: column; gap: 10px; }
    .bot-msg { background: #e0e0e0; padding: 10px; border-radius: 10px 10px 10px 0; max-width: 85%; line-height: 1.4; }
    .user-msg { background: #2193b0; color: white; padding: 10px; border-radius: 10px 10px 0 10px; max-width: 85%; align-self: flex-end; margin-left: auto; line-height: 1.4; }
    
    .chat-input-area { display: flex; padding: 10px; background: white; border-top: 1px solid #ddd; }
    .chat-input-area input { flex-grow: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 0.9rem; }
    .chat-input-area button { background: #2193b0; color: white; border: none; padding: 8px 15px; margin-left: 5px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* Modales */
    .img-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200; }
    .img-modal img { max-width: 90%; max-height: 80%; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .modal-mesa { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; }
    .modal-content input { width: 80%; padding: 10px; font-size: 1.2rem; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
  </style>
</head>

        grid.innerHTML += `
          <div class="plato-card">
            <div class="img-container"><img src="${plato.img}" class="plato-img" onclick="ampliarImagen(this.src)"></div>
            <div class="plato-info">
              <h3>${plato.nombre}</h3>${descHtml}
              <div class="precio-fila">
                <div class="precio">${precioFormat}</div>
                <button class="btn-add" onclick="agregarAlCarrito('${plato.nombre}', ${plato.precio})">+ Añadir</button>
              </div>
            </div>
          </div>`;
      });
      contenedor.appendChild(grid);
    });

    function agregarAlCarrito(nombre, precio, esSugerencia = false) {
      carrito.push({ nombre, precio });
      actualizarBarraCarrito();
      if(!esSugerencia) lanzarSugerenciaAutomatica(nombre);
    }

    function actualizarBarraCarrito() {
      const bar = document.getElementById('carritoBar');
      if(carrito.length > 0) {
        bar.style.display = 'flex';
        document.getElementById('cantPlatos').innerText = carrito.length;
        document.getElementById('totalPrecio').innerText = carrito.reduce((sum, item) => sum + item.precio, 0).toFixed(2).replace('.',',') + ' €';
      } else { bar.style.display = 'none'; }
    }

    function toggleChat() { 
      const chat = document.getElementById('chatWindow'); 
      chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex'; 
    }

    function enviarMensajeUsuario() {
      const input = document.getElementById('userInput');
      const texto = input.value.trim();
      if(!texto) return;

      const chatBody = document.getElementById('chatBody');
      
      // Mensaje del usuario
      chatBody.innerHTML += `<div class="user-msg">${texto}</div>`;
      input.value = '';
      chatBody.scrollTop = chatBody.scrollHeight;

      // Respuesta inteligente de la IA según lo que escriba
      setTimeout(() => {
        let respuesta = "¡Excelente elección! Tenemos una gran variedad de platos frescos preparados al momento. ¿Te apetece probar alguna de nuestras pastas o woks?";
        let textoMin = texto.toLowerCase();

        if (textoMin.includes("pizza") || textoMin.includes("comer")) {
          respuesta = "¡Nuestras pizzas son de lo mejor de la casa! Te recomiendo acompañarlas con un entrante como el Mozarillo Plaza.";
        } else if (textoMin.includes("beber") || textoMin.includes("copa") || textoMin.includes("cafe") || textoMin.includes("café")) {
          respuesta = "Para terminar, tenemos unos cafés increíbles y frappes como el Frappebaileys que están riquísimos. ¿Te apunto algo?";
        } else if (textoMin.includes("vegetariano") || textoMin.includes("vegano")) {
          respuesta = "¡Claro! Tenemos opciones estupendas como el Wok vegetariano o varias de nuestras ensaladas frescas.";
        } else if (textoMin.includes("postre") || textoMin.includes("dulce")) {
          respuesta = "¡Los postres caseros son irresistibles! Tienes el Banana split o fruta natural muy fresquita.";
        }

        chatBody.innerHTML += `<div class="bot-msg">${respuesta}</div>`;
        chatBody.scrollTop = chatBody.scrollHeight;
      }, 600);
    }

    function lanzarSugerenciaAutomatica(nombrePlato) {
      let nombreMin = nombrePlato.toLowerCase();
      let sugerencia = { nombre: "Pan con 'all i oli'", precio: 2.75 };
      if (nombreMin.includes("pizza") || nombreMin.includes("pasta") || nombreMin.includes("espaguetis")) { sugerencia = { nombre: "Mozarillo 'Plaza'", precio: 6.40 }; } 
      else if (nombreMin.includes("wok")) { sugerencia = { nombre: "Pan de pizza", precio: 5.35 }; } 
      else if (nombreMin.includes("ensalada")) { sugerencia = { nombre: "Aceitunas", precio: 2.25 }; }

      const chat = document.getElementById('chatWindow'); chat.style.display = 'flex';
      const chatBody = document.getElementById('chatBody'); const idMensaje = "msg-" + Date.now();
      chatBody.innerHTML += `
        <div class="bot-msg">
          ¡Gran elección el <b>${nombrePlato}</b>! 👨‍🍳 <br><br>
          ¿Te gustaría acompañarlo con nuestra ración de <b>${sugerencia.nombre}</b> por solo ${sugerencia.precio.toFixed(2).replace('.',',')} €?
          <div id="${idMensaje}" style="margin-top: 10px;">
            <button onclick="agregarAlCarrito('${sugerencia.nombre}', ${sugerencia.precio}, true); document.getElementById('${idMensaje}').innerHTML = '<span style=\\'color: green; font-weight: bold;\\'>✅ ¡Añadido!</span>';" 
              style="background:var(--accent); color:white; border:none; padding:8px 12px; border-radius:15px; cursor:pointer; font-weight:bold; width:100%;">
              + Añadir a la cuenta
            </button>
          </div>
        </div>`;
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function abrirModalMesa() { document.getElementById('modalMesa').style.display = 'flex'; }
    function ampliarImagen(src) { document.getElementById('imgAmpliada').src = src; document.getElementById('imgModal').style.display = 'flex'; }
    function cerrarImagen() { document.getElementById('imgModal').style.display = 'none'; }
  </script>
</body>
</html>
