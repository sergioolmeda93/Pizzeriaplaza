<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta - Pizzería Plaza</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #f39c12;
            --card-bg: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://placehold.co/1200x400/1a1a1a/f39c12?text=Pizzería+Plaza') center/cover;
            border-bottom: 4px solid var(--accent-color);
        }

        .header h1 {
            margin: 0;
            font-size: 3rem;
            color: var(--accent-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .categoria-titulo {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-top: 40px;
            font-size: 2rem;
            color: var(--accent-color);
        }

        .platos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .plato-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .plato-card:hover {
            transform: translateY(-5px);
        }

        .img-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .plato-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .plato-card:hover .plato-img {
            transform: scale(1.05);
        }

        .plato-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .plato-info h3 {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
        }

        .plato-info p {
            color: #ccc;
            font-size: 0.9rem;
            flex-grow: 1;
            margin: 0 0 15px 0;
        }

        .precio-fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .precio {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .btn-info {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-info:hover {
            background-color: #d68910;
        }

        /* MAGIA: Estos son los estilos que ponen el plato gris y el sello rojo */
        .plato-card.agotado { 
            opacity: 0.6; 
            filter: grayscale(100%); 
            pointer-events: none; /* Bloquea los clicks del cliente */
            position: relative; 
        }

        .plato-card.agotado::after { 
            content: "AGOTADO"; 
            position: absolute; 
            top: 40%; 
            left: 50%; 
            transform: translate(-50%, -50%) rotate(-10deg); 
            background: rgba(231, 76, 60, 0.95); /* Rojo intenso */
            color: white; 
            padding: 10px 20px; 
            font-weight: bold; 
            border-radius: 8px; 
            font-size: 1.5rem; 
            letter-spacing: 2px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            z-index: 10; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🍕 Pizzería Plaza</h1>
        <p>Descubre nuestra carta artesanal</p>
    </div>

    <div class="container" id="contenedor-carta">
        <!-- El menú se inyectará aquí desde Javascript -->
    </div>

    <script>
        // BASE DE DATOS DE TU CARTA
        const carta = [
            {
                categoria: "Woks y Entrantes",
                platos: [
                    { 
                        nombre: "Wok de Pulpo", 
                        descripcion: "Fideos udon, pulpo fresco, verduras salteadas con soja y sésamo.", 
                        precio: 14.50, 
                        img: "https://placehold.co/600x400/333/fff?text=Wok+de+Pulpo",
                        agotado: false // Plato normal
                    },
                    { 
                        nombre: "Nachos de la Casa", 
                        descripcion: "Totopos crujientes con queso fundido, guacamole, pico de gallo y jalapeños.", 
                        precio: 10.00, 
                        img: "https://placehold.co/600x400/333/fff?text=Nachos",
                        agotado: false 
                    }
                ]
            },
            {
                categoria: "Postres",
                platos: [
                    { 
                        nombre: "Tarta de Chocolate Fundido", 
                        descripcion: "Bizcocho caliente que se derrite por dentro. ¡Una explosión de sabor!", 
                        precio: 6.50, 
                        // AQUÍ ESTÁ EL GIF DE LA TARTA DERRITIÉNDOSE (funciona igual que una foto)
                        img: "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExc29lOG5zYTIyOTFmbnQwbWZmbjJ1cG92dGdjaGF0MWxyNHp3ZmFldSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3oz8xAFtjouK83isjm/giphy.webp",
                        // MODO AGOTADO ACTIVADO PARA ESTE PLATO:
                        agotado: true 
                    },
                    { 
                        nombre: "Tiramisú Clásico", 
                        descripcion: "Receta italiana original con mascarpone, café espresso y cacao puro.", 
                        precio: 5.50, 
                        img: "https://placehold.co/600x400/333/fff?text=Tiramisu",
                        agotado: false 
                    }
                ]
            }
        ];

        // Función para pintar la carta en la web
        function renderizarCarta() {
            const contenedor = document.getElementById('contenedor-carta');
            contenedor.innerHTML = ''; // Limpiamos antes de pintar

            carta.forEach((seccion) => {
                // Título de la categoría
                let titulo = document.createElement('h2');
                titulo.className = 'categoria-titulo';
                titulo.innerText = seccion.categoria;
                contenedor.appendChild(titulo);

                // Cuadrícula de platos
                let grid = document.createElement('div');
                grid.className = 'platos-grid';
                
                seccion.platos.forEach((plato) => {
                    // Verificamos si el plato está agotado para añadirle la clase CSS
                    let claseAgotado = plato.agotado ? 'agotado' : '';
                    
                    grid.innerHTML += `
                        <div class="plato-card ${claseAgotado}">
                            <div class="img-container">
                                <img src="${plato.img}" class="plato-img" alt="${plato.nombre}">
                            </div>
                            <div class="plato-info">
                                <h3>${plato.nombre}</h3>
                                <p>${plato.descripcion}</p>
                                <div class="precio-fila">
                                    <div class="precio">${plato.precio.toFixed(2)} €</div>
                                    <button class="btn-info">Pedir</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                contenedor.appendChild(grid);
            });
        }

        // Iniciamos la carta al cargar la página
        window.onload = function() {
            renderizarCarta();
        };
    </script>
</body>
</html>
