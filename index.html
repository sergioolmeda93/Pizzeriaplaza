    .plato-img{width:100%;height:100%;object-fit:cover;position:relative;z-index:2;}

    .btn-pedir{background:var(--accent);color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;width:100%}

    .detalle-tag{font-size:0.85rem;margin-top:8px;padding:10px;border-radius:8px;background:#f9f9f9;line-height:1.4}

    .cesta-lista{overflow-y:auto;max-height:45vh;margin-bottom:15px;display:flex;flex-direction:column;gap:10px}
    .cesta-item{display:flex;justify-content:space-between;align-items:center;background:#f9f9f9;padding:10px 15px;border-radius:10px}
    .controles-item{display:flex;align-items:center;gap:10px}
    .btn-control{background:#ddd;border:none;width:28px;height:28px;border-radius:50%;font-weight:bold;cursor:pointer;color:#333}

    .chat-header{background:#2193b0;color:white;padding:15px;font-weight:bold;display:flex;justify-content:space-between}
    .chat-body{padding:15px;flex-grow:1;overflow-y:auto;background:#f9f9f9;font-size:0.9rem;display:flex;flex-direction:column;gap:10px}

    function inicializarCategorias(){
      let g=document.getElementById('gridCategoriasInicio');
      g.innerHTML=`<div class="cat-inicio-card" onclick="mostrarTodosPlatos()"><div class="cat-icono">📋</div><h3>${i18n[currentLang].verTodo}</h3></div>`;
      menuData.forEach((s,i)=>{
        g.innerHTML+=`<div class="cat-inicio-card" onclick="mostrarCategoria(${i})"><div class="cat-icono">${s.icono}</div><h3>${s.categoriaObj[currentLang]}</h3></div>`
      });
    }

    function mostrarCategoria(i){
      document.getElementById('seccion-categorias').style.display='none';
      document.getElementById('seccion-platos').style.display='block';
      let c=document.getElementById('contenedor-carta');
      c.innerHTML="";
      renderizarSeccion(menuData[i],c,i);
      window.scrollTo(0,0)
    }

    function mostrarTodosPlatos(){
      document.getElementById('seccion-categorias').style.display='none';
      document.getElementById('seccion-platos').style.display='block';
      let c=document.getElementById('contenedor-carta');
      c.innerHTML="";
      menuData.forEach((s,i)=>renderizarSeccion(s,c,i));
      window.scrollTo(0,0)
    }
    
    function renderizarSeccion(s,c,catIdx){
      let t=document.createElement('h2');t.className='categoria-titulo';t.innerText=s.categoriaObj[currentLang];c.appendChild(t);
      let g=document.createElement('div');g.className='platos-grid';
      
      let agotados = JSON.parse(localStorage.getItem('platosAgotados') || '[]');

      s.platos.forEach((p,pIdx)=>{
        // La cocina maneja nombres en ESPAÑOL, usamos obj.es para verificar agotados
        let claseAgotado = agotados.includes(p.nombreObj.es) ? 'agotado' : '';
        let textoAgotado = i18n[currentLang].agotado;

        // SOPORTE PARA VÍDEO (.mp4) O IMAGEN ESTÁNDAR
        let mediaHtml = p.img.endsWith('.mp4') 
          ? `<video src="${p.img}" class="plato-img" autoplay loop muted playsinline></video>` 
          : `<img src="${p.img}" class="plato-img">`;

        g.innerHTML+=`<div class="plato-card ${claseAgotado}" data-agotado="${textoAgotado}" onclick="abrirDetalle(${catIdx},${pIdx})">
          <div class="img-container">${mediaHtml}</div>
          <div class="plato-info">
            <h3>${p.nombreObj[currentLang]}</h3>
            <div class="precio-fila"><div class="precio">${p.precio.toFixed(2)} €</div>
            <button class="btn-info">+ Info</button></div>
          </div>
        </div>`
      });
      c.appendChild(g)
    }
    
    function abrirDetalle(catIdx, pIdx) {
      platoAbiertoActual = menuData[catIdx].platos[pIdx];
      let plato = platoAbiertoActual;
      
      let mediaContainer = document.getElementById('detMediaContainer');
      // SOPORTE PARA VÍDEO EN EL DETALLE
      if (plato.img.endsWith('.mp4')) {
          mediaContainer.innerHTML = `<video class="detalle-img" src="${plato.img}" autoplay loop muted playsinline></video>`;
      } else {
          mediaContainer.innerHTML = `<img class="detalle-img" src="${plato.img}">`;
      }
      
      document.getElementById('detNombre').innerText = plato.nombreObj[currentLang];
      document.getElementById('detIng').innerText = typeof plato.ingredientesObj === 'object' ? (plato.ingredientesObj[currentLang] || "") : "Consulta con el camarero.";
      document.getElementById('detPrecio').innerText = plato.precio.toFixed(2) + " €";
      document.getElementById('detNotas').value = ""; 
      
      let contenedorExtras = document.getElementById('contenedorExtras');
      let listaExtras = document.getElementById('listaExtras');
      
      if (menuData[catIdx].categoriaObj.es === "Pizzas") {
        contenedorExtras.style.display = "block";
        listaExtras.innerHTML = extrasPizzas.map((e, idx) => `<label><input type="checkbox" class="chk-extra" value="${e.n.es}" data-p="${e.p}"> ${e.n[currentLang]} (+${e.p.toFixed(2)}€)</label>`).join('');
      } else {
        contenedorExtras.style.display = "none";
        listaExtras.innerHTML = "";
      }
      
      document.getElementById('modalDetalle').style.display = 'flex';
    }

    function añadirAlCarritoDesdeModal() {
      let extrasSeleccionados = [];
      let extraPrecioTotal = 0;
      document.querySelectorAll('.chk-extra:checked').forEach(c => {
         extrasSeleccionados.push(c.value); // Guardamos el nombre en ESPAÑOL para la cocina
         extraPrecioTotal += parseFloat(c.dataset.p);
      });
      
      let notas = document.getElementById('detNotas').value.trim();
      // IMPORTANTE: GUARDAR EN EL CARRITO CON EL NOMBRE EN ESPAÑOL PARA LA COCINA
      let nombreCesta = platoAbiertoActual.nombreObj.es; 
      
      if (extrasSeleccionados.length > 0) nombreCesta += " (" + extrasSeleccionados.join(", ") + ")";
      if (notas !== "") nombreCesta += " [Notas: " + notas + "]";
      
      let precioFinal = platoAbiertoActual.precio + extraPrecioTotal;
      
      let f = carrito.find(i => i.nombre === nombreCesta);
      if(f) f.cantidad++; else carrito.push({nombre: nombreCesta, nombreMostrar: platoAbiertoActual.nombreObj[currentLang], precio: precioFinal, cantidad: 1});
      
      actualizarBarraCarrito();
      mostrarListaCesta();
      document.getElementById('modalDetalle').style.display = 'none';
      lanzarSugerenciaAutomatica(platoAbiertoActual.nombreObj[currentLang]);
    }

    function mostrarCategorias(){document.getElementById('seccion-platos').style.display='none';document.getElementById('seccion-categorias').style.display='block';window.scrollTo(0,0)}
    function cambiarCantidad(n,c){let i=carrito.find(x=>x.nombre===n);if(i){i.cantidad+=c;if(i.cantidad<=0)carrito=carrito.filter(x=>x.nombre!==n)}actualizarBarraCarrito();mostrarListaCesta()}
    
    function actualizarBarraCarrito(){
      let b=document.getElementById('carritoBar'),tp=carrito.reduce((s,i)=>s+i.cantidad,0),tpr=carrito.reduce((s,i)=>s+(i.precio*i.cantidad),0);
      if(tp>0){b.style.display='flex';document.getElementById('cantPlatos').innerText=tp;document.getElementById('totalPrecio').innerText=tpr.toFixed(2)+' €'}
      else{b.style.display='none';cerrarCesta()}
    }
    
    function abrirCesta(){mostrarListaCesta();document.getElementById('modalCesta').style.display='flex'}
    function cerrarCesta(){document.getElementById('modalCesta').style.display='none'}
    
    function mostrarListaCesta(){
      let l=document.getElementById('cestaLista'),t=0;l.innerHTML="";
      carrito.forEach(i=>{
        t+=i.precio*i.cantidad;
        l.innerHTML+=`<div class="cesta-item"><div><strong style="color:var(--primary)">${i.nombreMostrar}</strong><br><small>${i.precio.toFixed(2)} € x ${i.cantidad}</small></div><div class="controles-item"><button class="btn-control" onclick="cambiarCantidad('${i.nombre.replace(/'/g,"\\'")}',-1)">-</button><span>${i.cantidad}</span><button class="btn-control" onclick="cambiarCantidad('${i.nombre.replace(/'/g,"\\'")}',1)">+</button></div></div>`
      });
      document.getElementById('cestaTotalPrecio').innerText=t.toFixed(2)+' €'
    }
    
    function toggleChat(){let c=document.getElementById('chatWindow');c.style.display=c.style.display==='flex'?'none':'flex'}
    
    // IA CONEXIÓN MEJORADA (Contexto de Menú)
    async function enviarMensajeUsuario(){
      let i=document.getElementById('userInput'), t=i.value.trim(), b=document.getElementById('chatBody');
      if(!t)return;
      b.innerHTML+=`<div class="user-msg">${t}</div>`; i.value=''; b.scrollTop=b.scrollHeight;
      b.innerHTML+=`<div class="bot-msg" id="typing">${i18n[currentLang].procesando}</div>`; b.scrollTop=b.scrollHeight;
      
      try {
        let menuContext = menuData.map(c => `${c.categoriaObj[currentLang]}: ` + c.platos.map(p => `${p.nombreObj[currentLang]} (${p.precio}€)`).join(', ')).join('. ');
        let p = `Eres el camarero virtual de la Pizzería Plaza. Responde SIEMPRE en el idioma: ${currentLang}. Sé amable, muy breve y servicial. Usa este menú real para responder: ${menuContext}. El cliente dice: ${t}`;
        
        let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({contents:[{parts:[{text: p}]}]}) });
        let data = await res.json();
        
        if(document.getElementById('typing')) document.getElementById('typing').remove();
        if(data.error) throw new Error(data.error.message);
        
        b.innerHTML+=`<div class="bot-msg">${data.candidates[0].content.parts[0].text.replace(/\n/g,"<br>")}</div>`;
      } catch(e) {
        if(document.getElementById('typing')) document.getElementById('typing').remove();
        b.innerHTML+=`<div class="bot-msg" style="border:2px solid red; background:#fff0f0;"><b>🚨 Error técnico:</b><br><span style="color:#c0392b;">${e.message}</span></div>`;
      }
      b.scrollTop=b.scrollHeight;
    }
    
    async function lanzarSugerenciaAutomatica(nombrePlatoUserLang){
      let c=document.getElementById('chatWindow'), b=document.getElementById('chatBody');
      c.style.display='flex';
      b.innerHTML+=`<div class="bot-msg" id="typingSug">${i18n[currentLang].procesando}</div>`;
      b.scrollTop=b.scrollHeight;

      try {
        let menuContext = menuData.map(c => c.platos.map(p => p.nombreObj[currentLang]).join(', ')).join('. ');
        let p = `Eres un camarero experto. El cliente acaba de pedir "${nombrePlatoUserLang}". Sugiérele brevemente UN SOLO acompañamiento (bebida, postre o entrante) que pegue bien con eso, usando platos de esta lista: ${menuContext}. Responde en idioma: ${currentLang}. Sé entusiasma y breve (1-2 frases).`;
        
        let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({contents:[{parts:[{text: p}]}]}) });
        let data = await res.json();
        
        if(document.getElementById('typingSug')) document.getElementById('typingSug').remove();
        if(!data.error) b.innerHTML+=`<div class="bot-msg">👨‍🍳 ${data.candidates[0].content.parts[0].text.replace(/\n/g,"<br>")}</div>`;
      } catch(e) {
         if(document.getElementById('typingSug')) document.getElementById('typingSug').remove();
      }
      b.scrollTop=b.scrollHeight;
    }
    
    function abrirModalMesa(t){
      tipoAccionMesa=t;
      cerrarCesta();
      document.getElementById('tituloModalMesa').innerText = t==='llamada' ? i18n[currentLang].mesaPreguntaLlamada : i18n[currentLang].mesaPreguntaPedido;
      document.getElementById('btnAccionMesa').innerText = t==='llamada' ? i18n[currentLang].btnLlamarMesa : i18n[currentLang].btnEnviarCocina;
      document.getElementById('modalMesa').style.display='flex';
    }
    
    function ejecutarAccionMesa(){
      let m=document.getElementById('numMesa').value, b=document.getElementById('btnAccionMesa');
      if(!m) return alert(i18n[currentLang].alertMesa);
      b.innerText = i18n[currentLang].procesando;
      b.disabled=true;
      
      let d={mesa:m, hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
      if(tipoAccionMesa==='llamada'){
        d.tipo="ATENCIÓN CAMARERO REQUERIDA";
      }else{
        let p=[];
        carrito.forEach(i=>{for(let j=0;j<i.cantidad;j++) p.push({nombre:i.nombre,precio:i.precio})});
        d.platos=p;
        d.total=p.reduce((s,i)=>s+i.precio,0)
      }
      
      fetch(DB_URL,{method:'POST',body:JSON.stringify(d)}).then(()=>{
        alert(tipoAccionMesa==='llamada' ? i18n[currentLang].alertLlamadaOk : i18n[currentLang].alertPedidoOk);
        if(tipoAccionMesa==='pedido'){carrito=[];actualizarBarraCarrito()}
        document.getElementById('modalMesa').style.display='none';
        b.innerText = i18n[currentLang].btnConfirmar;
        b.disabled=false
      }).catch(()=>{
        alert(i18n[currentLang].alertError);
        b.innerText = i18n[currentLang].btnConfirmar;
        b.disabled=false
      })
    }
    
    window.addEventListener('storage', function(e) {
      if(e.key === 'platosAgotados') {
        let menuAbierto = document.getElementById('seccion-platos').style.display === 'block';
        if (menuAbierto) mostrarTodosPlatos();
      }
    });
  </script>
</body>
