    :root{--primary:#2c3e50;--accent:#e74c3c;--bg:#f4f7f6;--card-bg:#ffffff;--gold:#f39c12}
    body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.85)),url('https://images.unsplash.com/photo-1590947132387-155cc02f3212?w=1000&q=80') center/cover fixed;margin:0;padding:15px;padding-bottom:140px;color:white}

    #seccion-categorias{display:block}

    .categorias-inicio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:15px;margin-top:20px}
    .cat-inicio-card{background:rgba(255,255,255,0.95);border-radius:15px;padding:20px;text-align:center;cursor:pointer;border-bottom:4px solid var(--accent);transition:transform 0.2s;color:#333}
    .cat-inicio-card:active{transform:scale(0.95)}
    .cat-inicio-card h3{color:var(--primary);margin:10px 0 0 0;font-size:1.1rem}
    .cat-icono{font-size:2.2rem}
    
    #seccion-platos{display:none}
    .btn-volver{background:var(--accent);color:white;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
    .categoria-titulo{color:var(--gold);border-bottom:2px solid var(--gold);padding-bottom:5px;margin-top:10px;font-size:1.5rem;text-transform:uppercase;text-shadow:1px 1px 3px rgba(0,0,0,0.8)}
    
    .platos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:15px}
    .plato-card{background:var(--card-bg);border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.3);display:flex;flex-direction:column;cursor:pointer;color:#333}
    .img-container{width:100%;height:120px;overflow:hidden}
    .plato-img{width:100%;height:100%;object-fit:cover;animation:movimientoVivo 10s infinite alternate ease-in-out}
    @keyframes movimientoVivo { 0%{transform:scale(1)} 100%{transform:scale(1.15) translate(-2%,-2%)} }
    .plato-info{padding:10px;display:flex;flex-direction:column;flex-grow:1}
    .plato-info h3{margin:0 0 5px 0;font-size:0.95rem;color:var(--primary);line-height:1.2}
    .precio-fila{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
    .precio{font-weight:bold;color:var(--primary);font-size:1.05rem}
    .btn-info{background:var(--accent);color:white;border:none;padding:5px 12px;border-radius:20px;font-weight:bold;font-size:0.85rem}
    
    .barra-flotante-inferior{position:fixed;bottom:15px;left:15px;right:15px;display:flex;gap:10px;z-index:100}
    .carrito-bar{flex-grow:1;background:var(--primary);color:white;border-radius:30px;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,0.5);cursor:pointer}
    .btn-llamar-camarero{background:var(--gold);color:white;border:none;border-radius:30px;padding:0 16px;font-weight:bold;font-size:0.9rem;box-shadow:0 4px 15px rgba(0,0,0,0.5);cursor:pointer}
    .btn-pedir{background:var(--accent);color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;width:100%}
    
    .modal-cesta,.modal-mesa,.modal-detalle{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:150}
    .modal-cesta{justify-content:flex-end;align-items:flex-end}
    .modal-detalle,.modal-mesa{justify-content:center;align-items:center;z-index:200}
    
    .detalle-content{background:white;color:#333;padding:20px;border-radius:15px;width:85%;max-width:350px;max-height:85vh;overflow-y:auto;position:relative;text-align:left}
    .detalle-img{width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:15px}
    .detalle-tag{font-size:0.85rem;margin-top:8px;padding:10px;border-radius:8px;background:#f9f9f9;line-height:1.4}
    
    .cesta-content{background:white;color:#333;width:100%;max-height:80vh;border-radius:20px 20px 0 0;padding:20px;display:flex;flex-direction:column;box-sizing:border-box}
    .cesta-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #eee;padding-bottom:10px;margin-bottom:15px}
    .cesta-lista{overflow-y:auto;max-height:45vh;margin-bottom:15px;display:flex;flex-direction:column;gap:10px}
    .cesta-item{display:flex;justify-content:space-between;align-items:center;background:#f9f9f9;padding:10px 15px;border-radius:10px}
    .controles-item{display:flex;align-items:center;gap:10px}
    .btn-control{background:#ddd;border:none;width:28px;height:28px;border-radius:50%;font-weight:bold;cursor:pointer;color:#333}
    
    .modal-content{background:white;color:#333;padding:25px;border-radius:15px;width:85%;max-width:350px;text-align:center}
    .modal-content input{width:80%;padding:10px;font-size:1.2rem;margin:15px 0;border:1px solid #ccc;border-radius:8px;text-align:center}
    
    .ia-btn{position:fixed;bottom:85px;right:15px;background:linear-gradient(135deg,#6dd5ed,#2193b0);color:white;border:none;border-radius:50px;padding:12px 20px;font-weight:bold;z-index:99;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
    .chat-window{display:none;position:fixed;bottom:85px;right:15px;width:320px;height:400px;background:white;color:#333;border-radius:15px;z-index:101;flex-direction:column;border:2px solid #2193b0}
    .chat-header{background:#2193b0;color:white;padding:15px;font-weight:bold;display:flex;justify-content:space-between}
    .chat-body{padding:15px;flex-grow:1;overflow-y:auto;background:#f9f9f9;font-size:0.9rem;display:flex;flex-direction:column;gap:10px}
    .bot-msg{background:#e0e0e0;padding:10px;border-radius:10px 10px 10px 0;max-width:85%}
    .user-msg{background:#2193b0;color:white;padding:10px;border-radius:10px 10px 0 10px;max-width:85%;align-self:flex-end}
    .chat-input-area{display:flex;padding:10px;background:white;border-top:1px solid #ddd}
    .chat-input-area input{flex-grow:1;padding:8px;border:1px solid #ccc;border-radius:20px;outline:none;color:#333}
    .chat-input-area button{background:#2193b0;color:white;border:none;padding:8px 15px;margin-left:5px;border-radius:20px;cursor:pointer}
    
    /* --- ESTILOS DE PLATO AGOTADO --- */
    .plato-card.agotado { opacity: 0.5; filter: grayscale(100%); pointer-events: none; position: relative; }
    .plato-card.agotado::after { content: "AGOTADO"; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg); background: rgba(231, 76, 60, 0.95); color: white; padding: 8px 15px; font-weight: bold; border-radius: 8px; font-size: 1.1rem; letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; }
  </style>

    const menuData = menu.map(c => ({categoria: c.c, icono: c.ic, platos: c.pl.map(p => ({ nombre: p.n, precio: p.p, img: p.i, ingredientes: p.in||"" }))}));
    
    function inicializarCategorias(){let g=document.getElementById('gridCategoriasInicio');g.innerHTML=`<div class="cat-inicio-card" onclick="mostrarTodosPlatos()"><div class="cat-icono">📋</div><h3>Ver Todo</h3></div>`;menuData.forEach((s,i)=>{g.innerHTML+=`<div class="cat-inicio-card" onclick="mostrarCategoria(${i})"><div class="cat-icono">${s.icono}</div><h3>${s.categoria}</h3></div>`});}
    function mostrarCategoria(i){document.getElementById('seccion-categorias').style.display='none';document.getElementById('seccion-platos').style.display='block';let c=document.getElementById('contenedor-carta');c.innerHTML="";renderizarSeccion(menuData[i],c,i);window.scrollTo(0,0)}
    function mostrarTodosPlatos(){document.getElementById('seccion-categorias').style.display='none';document.getElementById('seccion-platos').style.display='block';let c=document.getElementById('contenedor-carta');c.innerHTML="";menuData.forEach((s,i)=>renderizarSeccion(s,c,i));window.scrollTo(0,0)}
    
    /* --- FUNCION RENDERIZAR ACTUALIZADA PARA DETECTAR AGOTADOS --- */
    function renderizarSeccion(s,c,catIdx){
      let t=document.createElement('h2');t.className='categoria-titulo';t.innerText=s.categoria;c.appendChild(t);
      let g=document.createElement('div');g.className='platos-grid';
      
      let agotados = JSON.parse(localStorage.getItem('platosAgotados') || '[]');

      s.platos.forEach((p,pIdx)=>{
        let claseAgotado = agotados.includes(p.nombre) ? 'agotado' : '';

        g.innerHTML+=`<div class="plato-card ${claseAgotado}" onclick="abrirDetalle(${catIdx},${pIdx})">
          <div class="img-container"><img src="${p.img}" class="plato-img"></div>
          <div class="plato-info">
            <h3>${p.nombre}</h3>
            <div class="precio-fila"><div class="precio">${p.precio.toFixed(2)} €</div>
            <button class="btn-info">+ Info</button></div>
          </div>
        </div>`
      });
      c.appendChild(g)
    }
    
    function abrirDetalle(catIdx, pIdx) {
      platoAbiertoActual = menuData[catIdx].platos[pIdx];
      let plato = platoAbiertoActual;
      document.getElementById('detImg').src = plato.img;
      document.getElementById('detNombre').innerText = plato.nombre;
      document.getElementById('detIng').innerText = plato.ingredientes || "Consulta con el camarero.";
      document.getElementById('detPrecio').innerText = plato.precio.toFixed(2) + " €";
      document.getElementById('detNotas').value = ""; 
      
      let contenedorExtras = document.getElementById('contenedorExtras');
      let listaExtras = document.getElementById('listaExtras');
      if (menuData[catIdx].categoria === "Pizzas") {
        contenedorExtras.style.display = "block";
        listaExtras.innerHTML = extrasPizzas.map((e, idx) => `<label><input type="checkbox" class="chk-extra" value="${e.n}" data-p="${e.p}"> ${e.n} (+${e.p.toFixed(2)}€)</label>`).join('');
      } else {
        contenedorExtras.style.display = "none";
        listaExtras.innerHTML = "";
      }
      
      document.getElementById('modalDetalle').style.display = 'flex';
    }

    function añadirAlCarritoDesdeModal() {
      let extrasSeleccionados = [];
      let extraPrecioTotal = 0;
      document.querySelectorAll('.chk-extra:checked').forEach(c => {
         extrasSeleccionados.push(c.value);
         extraPrecioTotal += parseFloat(c.dataset.p);
      });
      
      let notas = document.getElementById('detNotas').value.trim();
      let nombreCesta = platoAbiertoActual.nombre;
      
      if (extrasSeleccionados.length > 0) nombreCesta += " (" + extrasSeleccionados.join(", ") + ")";
      if (notas !== "") nombreCesta += " [Notas: " + notas + "]";
      
      let precioFinal = platoAbiertoActual.precio + extraPrecioTotal;
      let f = carrito.find(i => i.nombre === nombreCesta);
      if(f) f.cantidad++; else carrito.push({nombre: nombreCesta, precio: precioFinal, cantidad: 1});
      
      actualizarBarraCarrito();
      mostrarListaCesta();
      document.getElementById('modalDetalle').style.display = 'none';
      lanzarSugerenciaAutomatica(platoAbiertoActual.nombre);
    }

    function mostrarCategorias(){document.getElementById('seccion-platos').style.display='none';document.getElementById('seccion-categorias').style.display='block';window.scrollTo(0,0)}
    function cambiarCantidad(n,c){let i=carrito.find(x=>x.nombre===n);if(i){i.cantidad+=c;if(i.cantidad<=0)carrito=carrito.filter(x=>x.nombre!==n)}actualizarBarraCarrito();mostrarListaCesta()}
    function actualizarBarraCarrito(){let b=document.getElementById('carritoBar'),tp=carrito.reduce((s,i)=>s+i.cantidad,0),tpr=carrito.reduce((s,i)=>s+(i.precio*i.cantidad),0);if(tp>0){b.style.display='flex';document.getElementById('cantPlatos').innerText=tp;document.getElementById('totalPrecio').innerText=tpr.toFixed(2)+' €'}else{b.style.display='none';cerrarCesta()}}
    function abrirCesta(){mostrarListaCesta();document.getElementById('modalCesta').style.display='flex'}
    function cerrarCesta(){document.getElementById('modalCesta').style.display='none'}
    function mostrarListaCesta(){let l=document.getElementById('cestaLista'),t=0;l.innerHTML="";carrito.forEach(i=>{t+=i.precio*i.cantidad;l.innerHTML+=`<div class="cesta-item"><div><strong style="color:var(--primary)">${i.nombre}</strong><br><small>${i.precio.toFixed(2)} € x ${i.cantidad}</small></div><div class="controles-item"><button class="btn-control" onclick="cambiarCantidad('${i.nombre.replace(/'/g,"\\'")}',-1)">-</button><span>${i.cantidad}</span><button class="btn-control" onclick="cambiarCantidad('${i.nombre.replace(/'/g,"\\'")}',1)">+</button></div></div>`});document.getElementById('cestaTotalPrecio').innerText=t.toFixed(2)+' €'}
    function toggleChat(){let c=document.getElementById('chatWindow');c.style.display=c.style.display==='flex'?'none':'flex'}
    
    // IA CONEXIÓN Y DETECCIÓN DE ERRORES EXACTOS
    async function enviarMensajeUsuario(){
      let i=document.getElementById('userInput'), t=i.value.trim(), b=document.getElementById('chatBody');
      if(!t)return;
      b.innerHTML+=`<div class="user-msg">${t}</div>`; i.value=''; b.scrollTop=b.scrollHeight;
      
      b.innerHTML+=`<div class="bot-msg" id="typing">Pensando...</div>`; b.scrollTop=b.scrollHeight;
      
      try {
        let p = "Eres el camarero de la Pizzería Plaza en España. Sé breve, amable y directo. Responde a este cliente: " + t;
        let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({contents:[{parts:[{text: p}]}]}) });
        let data = await res.json();
        
        if(document.getElementById('typing')) document.getElementById('typing').remove();
        
        if(data.error) throw new Error(data.error.message);
        
        b.innerHTML+=`<div class="bot-msg">${data.candidates[0].content.parts[0].text.replace(/\n/g,"<br>")}</div>`;
      } catch(e) {
        if(document.getElementById('typing')) document.getElementById('typing').remove();
        b.innerHTML+=`<div class="bot-msg" style="border:2px solid red; background:#fff0f0;"><b>🚨 Error técnico de Google:</b><br><span style="color:#c0392b;">${e.message}</span><br><br><small>Si dice 'API key not valid', tu contraseña de Google necesita unos minutos para propagarse o no se copió entera.</small></div>`;
      }
      b.scrollTop=b.scrollHeight;
    }
    
    function lanzarSugerenciaAutomatica(n){let c=document.getElementById('chatWindow'),b=document.getElementById('chatBody');c.style.display='flex';b.innerHTML+=`<div class="bot-msg">¡Gran elección la <b>${n}</b>! 👨‍🍳<br>¿Te gustaría acompañarlo con un postre o bebida de la carta?</div>`;b.scrollTop=b.scrollHeight}
    
    function abrirModalMesa(t){tipoAccionMesa=t;cerrarCesta();document.getElementById('tituloModalMesa').innerText=t==='llamada'?'¿Desde qué mesa nos llamas?':'¿En qué mesa estás?';document.getElementById('btnAccionMesa').innerText=t==='llamada'?'Llamar al camarero':'Enviar a cocina';document.getElementById('modalMesa').style.display='flex'}
    function ejecutarAccionMesa(){let m=document.getElementById('numMesa').value,b=document.getElementById('btnAccionMesa');if(!m)return alert("Introduce el número de tu mesa, por favor.");b.innerText="Procesando...";b.disabled=true;let d={mesa:m,hora:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};if(tipoAccionMesa==='llamada'){d.tipo="ATENCIÓN CAMARERO REQUERIDA"}else{let p=[];carrito.forEach(i=>{for(let j=0;j<i.cantidad;j++)p.push({nombre:i.nombre,precio:i.precio})});d.platos=p;d.total=p.reduce((s,i)=>s+i.precio,0)}fetch(DB_URL,{method:'POST',body:JSON.stringify(d)}).then(()=>{alert(tipoAccionMesa==='llamada'?"🔔 ¡Oído cocina! Un camarero acudirá enseguida a tu mesa.":"✅ ¡Tu pedido se ha enviado a la cocina correctamente!");if(tipoAccionMesa==='pedido'){carrito=[];actualizarBarraCarrito()}document.getElementById('modalMesa').style.display='none';b.innerText="Confirmar";b.disabled=false}).catch(()=>{alert("Error de red. Comprueba tu conexión a internet.");b.innerText="Confirmar";b.disabled=false})}
    
    /* --- RECARGA AUTOMÁTICA SI LA COCINA APAGA UN PLATO --- */
    window.addEventListener('storage', function(e) {
      if(e.key === 'platosAgotados') {
        let menuAbierto = document.getElementById('seccion-platos').style.display === 'block';
        if (menuAbierto) mostrarTodosPlatos(); // Refresca la lista sin parpadear
      }
    });

    window.onload=inicializarCategorias;
  </script>
</body>
</html>
