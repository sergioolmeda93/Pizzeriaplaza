<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><title>Cocina - Pizzería Plaza</title>
  <style>
    body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
    h1 { text-align: center; color: #2ecc71; border-bottom: 2px solid #333; padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
    
    .pedido-card { background: #333; padding: 20px; border-radius: 10px; border-left: 6px solid #2ecc71; }
    .llamada-card { background: #c0392b; padding: 20px; border-radius: 10px; border-left: 6px solid #f1c40f; animation: parpadeo 1.5s infinite; }
    
    @keyframes parpadeo { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.02); } }
    
    button { color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold; font-size: 1.1rem; }
    .btn-completar { background: #27ae60; }
    .btn-atender { background: #f39c12; }
    
    ul { padding-left: 20px; font-size: 1.1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>👨‍🍳 Panel de Recepción - Pizzería Plaza</h1>
  <div class="grid" id="panel">Cargando pedidos...</div>

  <script>
    const DB_URL = "https://pizzeria-plaza-63f10-default-rtdb.europe-west1.firebasedatabase.app/pedidos.json";
    
    function cargarPedidos() {
      fetch(DB_URL).then(r=>r.json()).then(data=>{
        let html = '';
        for(let id in data) {
          let p = data[id];
          if(p.tipo === "ATENCIÓN CAMARERO REQUERIDA") {
            html += `<div class="llamada-card">
              <h2 style="margin:0 0 10px 0;">🔔 ¡MESA ${p.mesa} LLAMA!</h2>
              <p style="margin:0; font-size: 1.2rem;">Hora: ${p.hora}</p>
              <button class="btn-atender" onclick="borrar('${id}')">✓ Ya he acudido</button>
            </div>`;
          } else {
            let lista = p.platos ? p.platos.map(x=>`<li>${x.nombre}</li>`).join('') : '';
            html += `<div class="pedido-card">
              <h2 style="margin:0 0 5px 0;">MESA ${p.mesa}</h2>
              <p style="margin:0 0 10px 0; color:#aaa;">Hora: ${p.hora}</p>
              <ul>${lista}</ul>
              <button class="btn-completar" onclick="borrar('${id}')">✓ Pedido Completado</button>
            </div>`;
          }
        }
        document.getElementById('panel').innerHTML = html || "<p style='text-align:center; width:100%; font-size:1.2rem; color:#888;'>No hay pedidos pendientes. Todo limpio.</p>";
      }).catch(e => console.log("Buscando nuevos pedidos..."));
    }
    
    function borrar(id) {
      fetch(`https://pizzeria-plaza-63f10-default-rtdb.europe-west1.firebasedatabase.app/pedidos/${id}.json`, {method: 'DELETE'}).then(cargarPedidos);
    }
    
    // La cocina se actualiza sola cada 3 segundos buscando nuevos avisos
    setInterval(cargarPedidos, 3000);
    cargarPedidos();
  </script>
</body>
</html>
