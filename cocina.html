<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Cocina - Plaza</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 15px; }
    h1 { text-align: center; color: #f39c12; border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 5px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 15px; background: #333; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: #f39c12; color: #1a1a1a; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    #pedidos-list { display: flex; flex-direction: column; gap: 15px; }
    .pedido-card { background: #2c3e50; padding: 15px; border-radius: 10px; border-left: 5px solid #e74c3c; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .pedido-header { display: flex; justify-content: space-between; align-items:center; font-weight: bold; font-size: 1.2rem; color: #f39c12; margin-bottom: 10px; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); }
    .plato-item { background: rgba(0,0,0,0.3); margin: 5px 0; padding: 8px; border-radius: 5px; font-size:1.1rem; }
    
    .btn-completar { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    .btn-completar:hover { background: #2ecc71; }

    .categoria-stock { color: #f39c12; border-bottom: 1px solid #333; padding-bottom: 5px; text-transform: uppercase; margin-top:30px; margin-bottom: 15px; font-size: 1.2rem;}
    .grid-stock { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .btn-stock { background: #27ae60; color: white; border: none; padding: 15px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    .btn-stock.agotado { background: #e74c3c; opacity: 0.8; border: 2px solid #c0392b; }
  </style>
</head>
<body>

  <h1>👨‍🍳 Panel de Cocina</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="cambiarPestaña('ordenes', this)">📦 Órdenes Activas</button>
    <button class="tab-btn" onclick="cambiarPestaña('stock', this)">❌ Control Stock</button>
  </div>

  <div id="ordenes" class="tab-content active">
    <div id="pedidos-list">
      <p style="text-align:center; color:#888;">Buscando nuevos pedidos en Firebase...</p>
    </div>
  </div>

  <div id="stock" class="tab-content">
    <p style="text-align:center; color:#aaa; font-size:0.9rem; margin-bottom: 20px;">Toca un plato para marcarlo como Agotado (Rojo). La carta de los clientes se actualizará automáticamente.</p>
    <div id="contenedor-stock"></div>
  </div>

  <script>
    function cambiarPestaña(id, boton) {
      document.querySelectorAll('.tab-content').forEach(d => d.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      boton.classList.add('active');
    }

    const DB_URL_BASE = "https://pizzeria-plaza-63f10-default-rtdb.europe-west1.firebasedatabase.app/pedidos";
    
    function cargarPedidos() {
      fetch(DB_URL_BASE + ".json")
        .then(res => res.json())
        .then(data => {
          let lista = document.getElementById('pedidos-list');
          lista.innerHTML = "";
          if(!data) { lista.innerHTML = "<p style='text-align:center; padding: 20px;'>No hay pedidos pendientes.</p>"; return; }
          
          let ordenesHtml = "";
          for(let key in data) {
            let p = data[key];
            let titulo = p.tipo === "ATENCIÓN CAMARERO REQUERIDA" ? "🔔 LLAMADA A MESA" : "🍕 NUEVO PEDIDO";
            
            let detalles = "";
            if(p.platos) {
              p.platos.forEach(plato => { detalles += `<div class="plato-item">1x ${plato.nombre}</div>`; });
            }

            // Usamos la 'key' de Firebase para poder borrar el pedido exacto
            ordenesHtml = `
              <div class="pedido-card">
                <div class="pedido-header">
                  <div>${titulo} (Mesa ${p.mesa}) <span style="font-size:0.9rem; color:#ccc; margin-left:10px;">${p.hora}</span></div>
                  <button class="btn-completar" onclick="completarPedido('${key}')">✅ Completar</button>
                </div>
                ${detalles}
              </div>` + ordenesHtml; // Añadimos arriba los más nuevos
          }
          lista.innerHTML = ordenesHtml;
        }).catch(err => console.error("Error al cargar pedidos:", err));
    }

    function completarPedido(id) {
      if(confirm("¿Marcar este pedido como completado y quitarlo de la pantalla?")) {
        fetch(DB_URL_BASE + "/" + id + ".json", {
          method: 'DELETE'
        }).then(() => {
          cargarPedidos(); // Recarga la lista para que desaparezca al instante
        });
      }
    }

    // Refrescar pedidos automáticamente cada 5 segundos
    setInterval(cargarPedidos, 5000); 
    cargarPedidos();

    const menuStock = [
      {c:"Pizzas", pl:["Margarita", "Napolitana", "Romana", "Capricciosa", "Salami", "Prosciutto", "Siciliana", "Rústica", "Frutti di mare", "Quatro Stagioni", "Pescatore", "Mafiosa", "Super Plaza", "Funghi", "Pepperoni", "Brassato", "Rúcula", "Vegetal", "Carpaccio", "4 quesos", "Tropical", "Tonno", "Boloñesa", "Marinera", "Nativa", "Salmón", "Calzone Plaza", "Nuevo México", "Varenne", "Jack de Mommes", "Barbacoa", "Bacalao", "Pulpo (XL)", "Jamón Serrano y champiñones", "Pizza de burrata (XL)"]},
      {c:"Carnes", pl:["Tagliata de entrecot", "Entrecot", "Escalope", "Escalope Cordon Bleu", "Escalopines Marsala", "Escalopines Plaza", "Medallones de solomillo", "Pechuga de pollo plancha"]},
      {c:"Pescados", pl:["Gambas al ajillo", "Calamar nacional plancha", "Calamar a la romana"]},
      {c:"Opciones Veganas", pl:["Hamburguesa Vegana", "Merluza vegana"]},
      {c:"Entrantes", pl:["Pan de pizza", "Mozarillo Plaza", "Surtido croquetas"]},
      {c:"Ensaladas", pl:["Mixta", "Capresse"]},
      {c:"Woks", pl:["Wok pollo", "Wok pulpo"]},
      {c:"Pastas", pl:["Espaguetis boloñesa", "Carbonara"]},
      {c:"Tartas Caseras", pl:["Queso con arándanos", "Banoffee", "Tarta de chocolate", "Tiramisú"]},
      {c:"Helados", pl:["Coulant de chocolate", "Copa Plaza"]},
      {c:"Café", pl:["Café solo"]}
    ];
    
    function renderizarStock() {
      let agotados = JSON.parse(localStorage.getItem('platosAgotados') || '[]');
      let contenedor = document.getElementById('contenedor-stock');
      contenedor.innerHTML = "";
      
      menuStock.forEach(categoria => {
        contenedor.innerHTML += `<h3 class="categoria-stock">${categoria.c}</h3>`;
        let gridHTML = `<div class="grid-stock">`;
        
        categoria.pl.forEach(nombrePlato => {
          let estaAgotado = agotados.includes(nombrePlato);
          let clase = estaAgotado ? "agotado" : "";
          let texto = estaAgotado ? "🔴 AGOTADO" : "🟢 Disponible";
          
          gridHTML += `
            <button class="btn-stock ${clase}" onclick="toggleAgotado('${nombrePlato}')">
              ${nombrePlato}<br><br><small>${texto}</small>
            </button>
          `;
        });
        
        gridHTML += `</div>`;
        contenedor.innerHTML += gridHTML;
      });
    }

    function toggleAgotado(nombre) {
      let agotados = JSON.parse(localStorage.getItem('platosAgotados') || '[]');
      if(agotados.includes(nombre)) {
        // Si estaba agotado, lo quitamos de la lista
        agotados = agotados.filter(n => n !== nombre); 
      } else {
        // Si estaba disponible, lo metemos en la lista
        agotados.push(nombre); 
      }
      localStorage.setItem('platosAgotados', JSON.stringify(agotados));
      renderizarStock(); // Repintamos los botones en la cocina
    }
    
    // Iniciar el stock al cargar
    renderizarStock();
  </script>
</body>
</html>
