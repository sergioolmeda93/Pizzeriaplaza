<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Cocina - Plaza</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 15px; }
    h1 { text-align: center; color: #f39c12; border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 5px; }
    
    /* PESTAÑAS */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 15px; background: #333; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #f39c12; color: #1a1a1a; }

    /* CONTENEDORES */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* PEDIDOS */
    #pedidos-list { display: flex; flex-direction: column; gap: 15px; }
    .pedido-card { background: #2c3e50; padding: 15px; border-radius: 10px; border-left: 5px solid #e74c3c; }
    .pedido-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; color: #f39c12; margin-bottom: 10px; }
    .plato-item { background: rgba(0,0,0,0.3); margin: 5px 0; padding: 8px; border-radius: 5px; }

    /* STOCK */
    .grid-stock { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .btn-stock { background: #27ae60; color: white; border: none; padding: 15px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-stock.agotado { background: #e74c3c; opacity: 0.7; }
  </style>
</head>
<body>

  <h1>👨‍🍳 Panel de Cocina</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="cambiarPestaña('ordenes', this)">📦 Órdenes Activas</button>
    <button class="tab-btn" onclick="cambiarPestaña('stock', this)">❌ Control Stock</button>
  </div>

  <!-- PESTAÑA 1: PEDIDOS QUE LLEGAN -->
  <div id="ordenes" class="tab-content active">
    <div id="pedidos-list">
      <p style="text-align:center; color:#888;">Buscando nuevos pedidos en Firebase...</p>
    </div>
  </div>

  <!-- PESTAÑA 2: CONTROL DE STOCK -->
  <div id="stock" class="tab-content">
    <div class="grid-stock" id="grid-stock"></div>
  </div>

  <script>
    // --- 1. LÓGICA DE LAS PESTAÑAS ---
    function cambiarPestaña(id, boton) {
      document.querySelectorAll('.tab-content').forEach(d => d.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      boton.classList.add('active');
    }

    // --- 2. LÓGICA DE LOS PEDIDOS (CONECTADO A TU FIREBASE) ---
    const DB_URL = "https://pizzeria-plaza-63f10-default-rtdb.europe-west1.firebasedatabase.app/pedidos.json";
    
    function cargarPedidos() {
      fetch(DB_URL)
        .then(res => res.json())
        .then(data => {
          let lista = document.getElementById('pedidos-list');
          lista.innerHTML = "";
          if(!data) { lista.innerHTML = "<p style='text-align:center;'>No hay pedidos pendientes.</p>"; return; }
          
          let ordenesHtml = "";
          for(let key in data) {
            let p = data[key];
            let titulo = p.tipo === "ATENCIÓN CAMARERO REQUERIDA" ? "🔔 LLAMADA A MESA" : "🍕 NUEVO PEDIDO";
            
            let detalles = "";
            if(p.platos) {
              p.platos.forEach(plato => { detalles += `<div class="plato-item">1x ${plato.nombre}</div>`; });
            }

            ordenesHtml += `
              <div class="pedido-card">
                <div class="pedido-header"><span>${titulo} (Mesa ${p.mesa})</span> <span>${p.hora}</span></div>
                ${detalles}
              </div>`;
          }
          lista.innerHTML = ordenesHtml;
        });
    }
    setInterval(cargarPedidos, 5000); // Comprueba pedidos nuevos cada 5 segundos
    cargarPedidos();

    // --- 3. LÓGICA DEL STOCK (AGOTAR PLATOS) ---
    // Copio algunos de tus platos principales para que la cocina los controle
    const todosLosPlatos = ["Tarta de chocolate", "Margarita", "Napolitana", "Pulpo (XL)", "Entrecot", "Calamar a la romana", "Wok pollo", "Wok pulpo"];
    
    function renderizarStock() {
      let agotados = JSON.parse(localStorage.getItem('platosAgotados') || '["Tarta de chocolate"]');
      let grid = document.getElementById('grid-stock');
      grid.innerHTML = "";
      
      todosLosPlatos.forEach(nombre => {
        let estaAgotado = agotados.includes(nombre);
        let clase = estaAgotado ? "agotado" : "";
        let texto = estaAgotado ? "🔴 AGOTADO" : "🟢 Disponible";
        
        grid.innerHTML += `
          <button class="btn-stock ${clase}" onclick="toggleAgotado('${nombre}')">
            ${nombre}<br><br><small>${texto}</small>
          </button>
        `;
      });
    }

    function toggleAgotado(nombre) {
      let agotados = JSON.parse(localStorage.getItem('platosAgotados') || '["Tarta de chocolate"]');
      if(agotados.includes(nombre)) {
        agotados = agotados.filter(n => n !== nombre); // Lo vuelve a poner disponible
      } else {
        agotados.push(nombre); // Lo marca como agotado
      }
      localStorage.setItem('platosAgotados', JSON.stringify(agotados));
      renderizarStock();
    }
    
    renderizarStock();
  </script>
</body>
</html>
