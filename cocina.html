<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDS Pizzería Plaza - Panel de Cocina</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #f59e0b; --danger: #ef4444; --success: #10b981; --border: #334155; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* HEADER & TABS */
    header { background-color: #020617; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
    h1 { margin: 0; font-size: 1.5rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    .tabs { display: flex; gap: 10px; }
    .tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    
    /* VISTAS */
    .view-section { display: none; padding: 20px; height: 100%; overflow-y: auto; }
    .view-section.active { display: block; }
    
    /* COMANDAS GRID */
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding-bottom: 50px; }
    .order-card { background: var(--panel); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .order-card.llamada { border-color: var(--danger); box-shadow: 0 0 15px rgba(239,68,68,0.2); }
    .order-header { background: #334155; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.2rem; }
    .order-card.llamada .order-header { background: var(--danger); color: white; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { background: var(--danger); } 50% { background: #b91c1c; } 100% { background: var(--danger); } }
    .order-body { padding: 15px; flex-grow: 1; font-size: 1.1rem; line-height: 1.6; }
    .order-item { border-bottom: 1px dashed var(--border); padding: 8px 0; }
    .order-item:last-child { border-bottom: none; }
    .order-footer { padding: 15px; background: #0f172a; border-top: 1px solid var(--border); }
    .btn-completar { width: 100%; background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-completar:hover { background: #059669; }
    
    /* STOCK ACORDEONES */
    .stock-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
    details { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    summary { padding: 15px 20px; font-size: 1.2rem; font-weight: bold; cursor: pointer; background: #1e293b; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: '▼'; font-size: 0.9rem; color: var(--accent); }
    details[open] summary::after { content: '▲'; }
    .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 15px; background: #0f172a; }
    .stock-btn { background: var(--panel); border: 2px solid var(--success); color: var(--text); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; text-align: center; transition: 0.2s; }
    .stock-btn.agotado { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); color: #fca5a5; position: relative; }
    .stock-btn.agotado::after { content: 'AGOTADO'; display: block; font-size: 0.7rem; color: var(--danger); margin-top: 5px; }
    
    /* ESTADISTICAS DASHBOARD */
    .stats-container { max-width: 1200px; margin: 0 auto; padding-bottom: 50px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .kpi-card { background: var(--panel); border: 1px solid var(--border); padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .kpi-card h3 { color: #94a3b8; margin: 0 0 10px 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
    .kpi-value { font-size: 2.5rem; font-weight: bold; color: var(--accent); margin: 0; }
    
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
    .chart-card { background: var(--panel); border: 1px solid var(--border); padding: 25px; border-radius: 12px; }
    .chart-card h3 { color: white; margin: 0 0 20px 0; font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    .ranking-list { list-style: none; padding: 0; margin: 0; }
    .ranking-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .ranking-name { flex-grow: 1; font-weight: bold; font-size: 1.1rem; }
    .ranking-bar-bg { width: 40%; background: var(--border); height: 12px; border-radius: 6px; overflow: hidden; margin-right: 15px; }
    .ranking-bar-fill { background: var(--accent); height: 100%; border-radius: 6px; }
    .ranking-count { font-weight: bold; color: var(--success); width: 40px; text-align: right; }

    /* LOADER */
    .loader { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .empty-state { text-align: center; color: #94a3b8; font-size: 1.2rem; padding: 50px 20px; }
  </style>
</head>
<body>

  <header>
    <h1>🔥 Pizzería Plaza <span style="color:#94a3b8; font-size:1rem; font-weight:normal;">| KDS</span></h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('comandas', this)">👨‍🍳 Comandas</button>
      <button class="tab-btn" onclick="switchTab('stock', this)">📦 Stock</button>
      <button class="tab-btn" onclick="switchTab('stats', this)">📊 Estadísticas</button>
    </div>
  </header>

  <!-- VISTA COMANDAS -->
  <section id="view-comandas" class="view-section active">
    <div id="loading-orders" class="loader"></div>
    <div id="orders-grid" class="orders-grid" style="display:none;"></div>
  </section>

  <!-- VISTA STOCK -->
  <section id="view-stock" class="view-section">
    <div class="stock-container" id="stock-container">
      <!-- Se genera por JS -->
    </div>
  </section>

  <!-- VISTA ESTADISTICAS -->
  <section id="view-stats" class="view-section">
    <div class="stats-container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;">Rendimiento Histórico</h2>
        <span style="background:var(--accent); color:black; padding:5px 10px; border-radius:20px; font-weight:bold; font-size:0.8rem;">ACTUALIZADO EN VIVO</span>
      </div>
      
      <div class="kpi-grid">
        <div class="kpi-card">
          <h3>Ingresos Brutos</h3>
          <p class="kpi-value" id="stat-ingresos">0.00 €</p>
        </div>
        <div class="kpi-card">
          <h3>Total Pedidos</h3>
          <p class="kpi-value" id="stat-pedidos">0</p>
        </div>
        <div class="kpi-card">
          <h3>Ticket Medio</h3>
          <p class="kpi-value" id="stat-ticket">0.00 €</p>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3>🏆 Top 5 Platos Más Vendidos</h3>
          <ul class="ranking-list" id="stat-top-platos">
            <div class="loader" style="width:20px; height:20px; border-width:3px;"></div>
          </ul>
        </div>
        <div class="chart-card">
          <h3>📝 Últimas Acciones (Log)</h3>
          <div id="stat-log" style="font-family:monospace; color:#94a3b8; font-size:0.9rem; max-height:200px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;">
            <!-- Log de eventos -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const DB_URL = "https://pizzeria-plaza-63f10-default-rtdb.europe-west1.firebasedatabase.app/pedidos.json";
    
    // MENÚ COMPLETO (SOLO NOMBRES PARA EL STOCK, SACADO DE TU CARTA)
    const categoriasStock = [
      { n: "Pizzas", p: ["Margarita", "Napolitana", "Romana", "Capricciosa", "Salami", "Prosciutto", "Siciliana", "Rústica", "Frutti di mare", "Quatro Stagioni", "Pescatore", "Mafiosa", "Super Plaza", "Funghi", "Pepperoni", "Brassato", "Rúcula", "Vegetal", "Carpaccio", "4 quesos", "Tropical", "Tonno", "Boloñesa", "Marinera", "Nativa", "Salmón", "Calzone Plaza", "Nuevo México", "Varenne", "Jack de Mommes", "Barbacoa", "Bacalao", "Pulpo (XL)", "Jamón Serrano y champiñones", "Pizza de burrata (XL)"] },
      { n: "Carnes", p: ["Tagliata de entrecot", "Entrecot", "Escalope", "Escalope Cordon Bleu", "Escalopines Marsala", "Escalopines Plaza", "Medallones de solomillo", "Pechuga de pollo plancha"] },
      { n: "Pescados", p: ["Gambas al ajillo", "Calamar nacional plancha", "Calamar a la romana"] },
      { n: "Opciones Veganas", p: ["Hamburguesa Vegana", "Merluza vegana"] },
      { n: "Entrantes", p: ["Pan de pizza", "Mozarillo Plaza", "Surtido croquetas"] },
      { n: "Ensaladas", p: ["Mixta", "Capresse"] },
      { n: "Woks", p: ["Wok pollo", "Wok pulpo"] },
      { n: "Pastas", p: ["Espaguetis boloñesa", "Carbonara"] },
      { n: "Tartas Caseras", p: ["Queso con arándanos", "Banoffee", "Tarta de chocolate", "Tiramisú"] },
      { n: "Helados y Café", p: ["Coulant de chocolate", "Copa Plaza", "Café solo"] }
    ];

    let allOrdersData = {};

    // NAVEGACIÓN
    function switchTab(tabId, btn) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + tabId).classList.add('active');
      btn.classList.add('active');
      
      if(tabId === 'stats') procesarEstadisticas();
    }

    // --- SISTEMA DE COMANDAS Y BD ---
    function fetchPedidos() {
      fetch(DB_URL)
        .then(res => res.json())
        .then(data => {
          allOrdersData = data || {};
          renderizarComandas(allOrdersData);
          if (document.getElementById('view-stats').classList.contains('active')) {
            procesarEstadisticas(); // Refrescar stats si la pestaña está abierta
          }
        })
        .catch(err => console.error("Error BD:", err));
    }

    function renderizarComandas(data) {
      const grid = document.getElementById('orders-grid');
      const loader = document.getElementById('loading-orders');
      grid.innerHTML = '';
      
      let hayPendientes = false;

      for (let id in data) {
        let p = data[id];
        // SOLO MOSTRAR PEDIDOS QUE NO ESTÉN COMPLETADOS
        if (p.estado === 'completado') continue;
        
        hayPendientes = true;
        let esLlamada = p.tipo && p.tipo.includes("CAMARERO");
        let esCuenta = p.tipo && p.tipo.includes("CUENTA");
        
        let card = document.createElement('div');
        card.className = `order-card ${esLlamada || esCuenta ? 'llamada' : ''}`;
        
        let cabeceraColor = esLlamada ? '🔴 ATENCIÓN CAMARERO' : (esCuenta ? '💳 LA CUENTA' : '🍽️ NUEVO PEDIDO');
        
        let listaPlatos = "";
        if (p.platos && p.platos.length > 0) {
          listaPlatos = p.platos.map(pl => `<div class="order-item">👉 ${pl.nombre}</div>`).join('');
        } else if (esCuenta) {
          listaPlatos = `<div class="order-item" style="text-align:center; padding: 20px 0;">El cliente ha pedido la cuenta.</div>`;
        } else {
           listaPlatos = `<div class="order-item" style="text-align:center; padding: 20px 0;">Acudir a la mesa.</div>`;
        }

        card.innerHTML = `
          <div class="order-header">
            <span>${cabeceraColor}</span>
            <span>Mesa ${p.mesa}</span>
          </div>
          <div class="order-body">
            <div style="color:var(--accent); font-size:0.9rem; margin-bottom:10px;">⌚ Hora: ${p.hora || 'Reciente'}</div>
            ${listaPlatos}
          </div>
          <div class="order-footer">
            <button class="btn-completar" onclick="marcarCompletado('${id}', '${p.mesa}')">✔ Completar</button>
          </div>
        `;
        grid.prepend(card); // Los nuevos primero
      }

      loader.style.display = 'none';
      if(hayPendientes) {
        grid.style.display = 'grid';
      } else {
        grid.style.display = 'block';
        grid.innerHTML = '<div class="empty-state">✅ No hay pedidos pendientes. ¡Buen trabajo!</div>';
      }
    }

    function marcarCompletado(id, mesa) {
      // EN LUGAR DE BORRAR (DELETE), ACTUALIZAMOS A COMPLETADO PARA GUARDAR ESTADÍSTICAS
      let urlActualizar = DB_URL.replace('.json', `/${id}.json`);
      
      fetch(urlActualizar, {
        method: 'PATCH',
        body: JSON.stringify({ estado: 'completado', completadoEn: new Date().toISOString() })
      }).then(() => {
        fetchPedidos(); // Recargar datos
        console.log(`Mesa ${mesa} completada.`);
      }).catch(err => alert("Error al completar el pedido."));
    }

    // --- SISTEMA DE STOCK ---
    function renderizarStock() {
      const container = document.getElementById('stock-container');
      let agotados = JSON.parse(localStorage.getItem('platosAgotados') || '[]');
      
      categoriasStock.forEach(cat => {
        let details = document.createElement('details');
        // Abrir la primera categoría por defecto
        if(cat.n === "Pizzas") details.open = true; 
        
        let summary = document.createElement('summary');
        summary.innerText = cat.n;
        
        let grid = document.createElement('div');
        grid.className = 'stock-grid';
        
        cat.p.forEach(plato => {
          let btn = document.createElement('button');
          let isAgotado = agotados.includes(plato);
          btn.className = `stock-btn ${isAgotado ? 'agotado' : ''}`;
          btn.innerText = plato;
          
          btn.onclick = () => {
            let index = agotados.indexOf(plato);
            if (index > -1) {
              agotados.splice(index, 1); // Quitar de agotados
              btn.classList.remove('agotado');
            } else {
              agotados.push(plato); // Poner en agotados
              btn.classList.add('agotado');
            }
            localStorage.setItem('platosAgotados', JSON.stringify(agotados));
            // Forzar disparo del evento storage para la carta abierta en la misma tablet/ordenador
            window.dispatchEvent(new Event('storage'));
          };
          grid.appendChild(btn);
        });
        
        details.appendChild(summary);
        details.appendChild(grid);
        container.appendChild(details);
      });
    }

    // --- SISTEMA DE ESTADÍSTICAS ---
    function procesarEstadisticas() {
      let ingresosTotales = 0;
      let pedidosComidaTotales = 0;
      let conteoPlatos = {};
      let logHtml = "";
      
      // Recorremos TODO el historial de la BD
      let ordersArray = Object.values(allOrdersData).reverse(); // Más recientes primero para el log
      
      ordersArray.forEach(p => {
        // Ignorar las llamadas al camarero simples para las finanzas
        if(p.tipo === "ATENCIÓN CAMARERO REQUERIDA" || p.tipo === "CUENTA SOLICITADA") {
            logHtml += `<div>[${p.hora || '-'}] Mesa ${p.mesa} - ${p.tipo}</div>`;
            return;
        }

        // Sumar pedidos de comida
        pedidosComidaTotales++;
        if(p.total) ingresosTotales += parseFloat(p.total);

        logHtml += `<div>[${p.hora || '-'}] Mesa ${p.mesa} pidió ${p.platos ? p.platos.length : 0} items (${(p.total || 0).toFixed(2)}€) - Estado: ${p.estado || 'Activo'}</div>`;

        // Contar platos para el Ranking
        if(p.platos && Array.isArray(p.platos)) {
          p.platos.forEach(platoObj => {
             let nombreReal = platoObj.nombre;
             // Limpiar si tiene extras en el nombre Ej: "Margarita (Ingrediente extra) [Notas: Sin cebolla]"
             let nombreBase = nombreReal.split('(')[0].split('[')[0].trim();
             
             if(conteoPlatos[nombreBase]) {
               conteoPlatos[nombreBase]++;
             } else {
               conteoPlatos[nombreBase] = 1;
             }
          });
        }
      });

      // Actualizar KPIs
      document.getElementById('stat-ingresos').innerText = ingresosTotales.toFixed(2) + " €";
      document.getElementById('stat-pedidos').innerText = pedidosComidaTotales;
      let ticketMedio = pedidosComidaTotales > 0 ? (ingresosTotales / pedidosComidaTotales) : 0;
      document.getElementById('stat-ticket').innerText = ticketMedio.toFixed(2) + " €";
      document.getElementById('stat-log').innerHTML = logHtml || "No hay registros.";

      // Ordenar y mostrar Top 5 Platos
      let arrayPlatos = Object.keys(conteoPlatos).map(nombre => {
        return { nombre: nombre, cantidad: conteoPlatos[nombre] };
      });
      
      arrayPlatos.sort((a, b) => b.cantidad - a.cantidad);
      let top5 = arrayPlatos.slice(0, 5);
      
      let maxVentas = top5.length > 0 ? top5[0].cantidad : 1; // Para el 100% de la barra
      
      let rankingHtml = "";
      if(top5.length === 0) rankingHtml = "<div class='empty-state' style='padding:10px;'>Sin datos de ventas aún.</div>";
      
      top5.forEach((item, index) => {
         let porcentaje = (item.cantidad / maxVentas) * 100;
         rankingHtml += `
            <li class="ranking-item">
              <span style="color:var(--accent); font-weight:bold; margin-right:10px;">#${index+1}</span>
              <span class="ranking-name">${item.nombre}</span>
              <div class="ranking-bar-bg"><div class="ranking-bar-fill" style="width: ${porcentaje}%;"></div></div>
              <span class="ranking-count">${item.cantidad}</span>
            </li>
         `;
      });
      
      document.getElementById('stat-top-platos').innerHTML = rankingHtml;
    }

    // INICIAR LA APP
    renderizarStock();
    fetchPedidos();
    setInterval(fetchPedidos, 5000); // Polling cada 5 segundos

  </script>
</body>
</html>
