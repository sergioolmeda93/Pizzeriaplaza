<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Cocina - Pizzería Plaza</title>
  <style>
    body { font-family: sans-serif; background-color: #2c3e50; color: white; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #ecf0f1; border-bottom: 2px solid #e74c3c; padding-bottom: 10px; }
    #pedidos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
    .pedido-card { background: white; color: #333; border-radius: 12px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border-top: 8px solid #e74c3c; animation: parpadeo 1s ease-in-out 3; }
    .pedido-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #ccc; padding-bottom: 10px; margin-bottom: 10px; }
    .mesa-badge { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; }
    .hora { color: #7f8c8d; font-weight: bold; }
    .lista-platos { list-style: none; padding: 0; margin: 0 0 15px 0; font-size: 1.1rem; line-height: 1.5; }
    .lista-platos li { border-bottom: 1px solid #eee; padding: 5px 0; }
    .btn-completar { background: #27ae60; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    @keyframes parpadeo { 0% { transform: scale(1); box-shadow: 0 0 0 rgba(231, 76, 60, 0); } 50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(231, 76, 60, 0.8); } 100% { transform: scale(1); box-shadow: 0 8px 25px rgba(0,0,0,0.5); } }
  </style>
</head>
<body>

  <h1>👨‍🍳 Panel de Recepción de Pedidos</h1>
  <div style="text-align:center; margin-bottom: 20px;">
    <button onclick="activarSonido(this)" style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor:pointer;">
      🔊 Activar Avisos de Voz (Pulsa al abrir la web)
    </button>
  </div>
  <div id="pedidos-grid"></div>

  <script>
    const DB_URL = "https://pizzeria-plaza-63f10-default-rtdb.europe-west1.firebasedatabase.app/pedidos.json";
    let pedidosMostrados = {};
    let sonidoActivado = false;

    function activarSonido(btn) {
      sonidoActivado = true; btn.style.background = "#27ae60"; btn.innerText = "✅ Avisos de Voz Activados";
      let voz = new SpeechSynthesisUtterance("Sistema de cocina activado");
      voz.lang = 'es-ES'; window.speechSynthesis.speak(voz);
    }

    function cargarPedidos() {
      fetch(DB_URL).then(res => res.json()).then(data => {
          if (!data) return;
          for (const id in data) {
            if (!pedidosMostrados[id]) {
              pedidosMostrados[id] = data[id];
              mostrarTarjetaPedido(id, data[id]);
              if (sonidoActivado) {
                let aviso = new SpeechSynthesisUtterance("Atención, nuevo pedido en la mesa " + data[id].mesa);
                aviso.lang = 'es-ES'; aviso.rate = 1.1; window.speechSynthesis.speak(aviso);
              }
            }
          }
        });
    }

    function mostrarTarjetaPedido(id, pedido) {
      const grid = document.getElementById('pedidos-grid');
      let conteoPlatos = {};
      pedido.platos.forEach(p => { conteoPlatos[p.nombre] = (conteoPlatos[p.nombre] || 0) + 1; });
      let listaHtml = "";
      for (const nombre in conteoPlatos) { listaHtml += `<li><strong>${conteoPlatos[nombre]}x</strong> ${nombre}</li>`; }

      const tarjeta = document.createElement('div'); tarjeta.className = 'pedido-card'; tarjeta.id = id;
      tarjeta.innerHTML = `
        <div class="pedido-header"><div class="mesa-badge">Mesa ${pedido.mesa}</div><div class="hora">🕒 ${pedido.hora}</div></div>
        <ul class="lista-platos">${listaHtml}</ul>
        <div style="text-align:right; font-weight:bold; margin-bottom: 15px; color:#e74c3c;">Total: ${pedido.total.toFixed(2).replace('.',',')} €</div>
        <button class="btn-completar" onclick="completarPedido('${id}')">✅ Servido (Borrar)</button>
      `;
      grid.prepend(tarjeta);
    }

    function completarPedido(id) {
      fetch(`https://pizzeria-plaza-63f10-default-rtdb.europe-west1.firebasedatabase.app/pedidos/${id}.json`, { method: 'DELETE' })
      .then(() => { document.getElementById(id).remove(); delete pedidosMostrados[id]; });
    }
    setInterval(cargarPedidos, 3000);
  </script>
</body>
</html>
